slug: estudo-ativo
name: Revisa Aí
priority: 20
status: queued
pitch: Cole seu material de estudo e receba flashcards e quizzes prontos, com revisão espaçada que diz exatamente o que revisar hoje.
audience: Estudantes de concurso, vestibular, OAB e faculdade no Brasil que estudam por resumos e PDFs e esquecem o conteúdo.
problem: Criar flashcards à mão leva horas e quem estuda não sabe o que revisar em cada dia, então esquece a maior parte do que leu.
pricing:
  currency: brl
  monthlyCents: 1990
  freeTier: 1 baralho e até 30 cards gerados por IA por mês, com revisão espaçada completa.
  proTier: Baralhos e geração ilimitados, quizzes de múltipla escolha, estatísticas de retenção por baralho e exportação em CSV.
activationEvent: review_session_completed
features:
  - Criar baralho colando texto (até 8.000 caracteres) ou um tema; a IA gera de 10 a 30 cards pergunta/resposta em JSON validado; o usuário revisa e edita os cards antes de salvar.
  - Criação e edição manual de cards.
  - Revisão espaçada SM-2 — fila "Revisar hoje" com botões Errei, Difícil, Bom e Fácil; ao terminar a sessão dispara review_session_completed.
  - Quiz de múltipla escolha gerado a partir dos cards do baralho (Pro).
  - Painel com cards para hoje, streak de dias estudados e taxa de acerto por baralho (estatísticas detalhadas no Pro).
integrations: [bedrock, stripe]
constraints:
  - Os limites do plano grátis são contados no servidor por mês-calendário.
  - Os cards gerados ficam salvos; a IA nunca é chamada de novo para o mesmo texto.
  - Upload de PDF fica fora; só texto colado.
outOfScope:
  - Upload de PDF ou imagem, compartilhamento de baralhos, app mobile, áudio.
