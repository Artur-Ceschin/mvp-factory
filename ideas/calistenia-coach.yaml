slug: calistenia-coach
name: Barra Fixa
priority: 10
status: queued
pitch: Seu personal trainer de calistenia — um plano semanal que se adapta ao seu nível, ao equipamento que você tem e ao seu objetivo.
audience: Adultos de 18 a 40 anos que treinam em casa, na praça ou em parques com barra, querem evoluir em calistenia (primeira barra, muscle-up, parada de mão) e acham personal caro.
problem: Treinos genéricos de internet não respeitam o nível da pessoa, não têm progressão e ela não sabe quando avançar. Personal trainer custa R$ 150+/mês.
pricing:
  currency: brl
  monthlyCents: 2490
  freeTier: Avaliação inicial e 1 treino gerado por semana com progressões básicas.
  proTier: Plano semanal completo e adaptativo, progressões até skills (muscle-up, front lever, parada de mão), ajuste automático pelo feedback de cada treino e histórico de evolução.
activationEvent: workout_completed
features:
  - Onboarding de avaliação — nível atual (máximo de barras, flexões, dips, prancha), equipamento disponível (barra, paralelas, argolas, só chão), dias por semana, tempo por treino e objetivo (força, hipertrofia, skill específica).
  - Biblioteca fixa de exercícios no código, com cadeias de progressão (ex. barra australiana → negativa → barra completa → barra com peso), cada um com descrição curta e cues de execução em pt-BR.
  - Geração do plano semanal com IA (completeJson) restrita a IDs da biblioteca; o servidor valida o JSON e descarta exercícios desconhecidos. Sem IA disponível, gera um plano por regras.
  - Tela "Treino de hoje" com séries, repetições/tempo, descanso e checkbox por série; ao concluir, registra RPE (fácil/ok/difícil) e dispara workout_completed.
  - Progressão automática — após 2 treinos "fácil" num exercício, avança na cadeia; após "difícil", mantém ou regride.
  - Tela de progresso com streak semanal, total de treinos e o nível atual em cada cadeia.
integrations: [bedrock, stripe]
constraints:
  - Aviso de saúde visível no onboarding — o app não substitui orientação médica ou profissional; em caso de dor, pare.
  - O plano só pode conter exercícios da biblioteca; nunca texto livre da IA como instrução de exercício.
  - Free tier aplicado no servidor (1 geração de treino por semana).
outOfScope:
  - Vídeos próprios, nutrição, comunidade, app nativo, integração com relógios.
