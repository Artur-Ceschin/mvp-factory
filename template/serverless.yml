# CORE FILE — generated apps must not edit. App identity/pricing comes from factory.app.json.
service: mvp-${file(./factory.app.json):slug}

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ${opt:region, env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  logRetentionInDays: 14
  tags:
    factory: mvp-factory
    app: ${file(./factory.app.json):slug}
  stackTags:
    factory: mvp-factory
    app: ${file(./factory.app.json):slug}
  environment:
    APP_SLUG: ${file(./factory.app.json):slug}
    APP_NAME: ${file(./factory.app.json):name}
    STAGE: ${sls:stage}
    APP_VERSION: ${env:APP_VERSION, 'local'}
    TABLE_NAME: { Ref: Table }
    SECRETS_PATH: /mvp/${file(./factory.app.json):slug}/${sls:stage}
    PRICE_CENTS: ${file(./factory.app.json):priceCents}
    PRICE_CURRENCY: ${file(./factory.app.json):currency}
    BEDROCK_MODEL_ID: ${file(./factory.app.json):bedrockModelId}
    BEDROCK_REGION: ${file(./factory.app.json):bedrockRegion}
    NODE_OPTIONS: --enable-source-maps
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource:
            - { "Fn::GetAtt": [Table, Arn] }
            - { "Fn::Join": ["", [{ "Fn::GetAtt": [Table, Arn] }, "/index/*"]] }
        - Effect: Allow
          Action: ssm:GetParametersByPath
          Resource:
            "Fn::Join":
              - ""
              - - "arn:aws:ssm:"
                - { Ref: AWS::Region }
                - ":"
                - { Ref: AWS::AccountId }
                - ":parameter/mvp/${file(./factory.app.json):slug}/${sls:stage}"
        - Effect: Allow
          Action: kms:Decrypt
          Resource: "*"
          Condition:
            StringEquals:
              kms:ViaService: { "Fn::Join": ["", ["ssm.", { Ref: AWS::Region }, ".amazonaws.com"]] }
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource: "*"

package:
  patterns:
    - "!**"
    - "dist/**"

functions:
  api:
    handler: dist/handler.handler
    events:
      - httpApi: "*"

resources:
  Resources:
    Table:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
  Outputs:
    TableName:
      Value: { Ref: Table }
