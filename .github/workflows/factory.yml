name: factory

on:
  schedule:
    - cron: "17 9 * * *" # daily 06:17 America/Sao_Paulo
  workflow_dispatch:
    inputs:
      command:
        description: "factory command (run | build <slug> | ship <slug> | iterate <slug> | score)"
        default: run
        required: true

concurrency:
  group: factory
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # GitHub OIDC → AWS role, no long-lived AWS keys
  issues: write

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for the design-review screenshots.
      - run: pnpm exec playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run factory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY_DEV: ${{ secrets.STRIPE_SECRET_KEY_DEV }}
          STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
          PLUGGY_CLIENT_ID_DEV: ${{ secrets.PLUGGY_CLIENT_ID_DEV }}
          PLUGGY_CLIENT_SECRET_DEV: ${{ secrets.PLUGGY_CLIENT_SECRET_DEV }}
          PLUGGY_CLIENT_ID_PROD: ${{ secrets.PLUGGY_CLIENT_ID_PROD }}
          PLUGGY_CLIENT_SECRET_PROD: ${{ secrets.PLUGGY_CLIENT_SECRET_PROD }}
          COMMAND: ${{ github.event.inputs.command || 'run' }}
        run: |
          # word-split COMMAND into args on purpose (e.g. "build calistenia-coach")
          pnpm exec tsx orchestrator/src/cli.ts $COMMAND

      - name: Commit generated apps, registry and report
        if: always()
        run: |
          git config user.name "mvp-factory[bot]"
          git config user.email "mvp-factory@users.noreply.github.com"
          git add apps registry.json reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "factory: ${COMMAND:-run} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
        env:
          COMMAND: ${{ github.event.inputs.command || 'run' }}

      - name: Open issue for kill candidates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("registry.json")) process.exit(0);
            const reg = JSON.parse(fs.readFileSync("registry.json", "utf8"));
            for (const r of Object.values(reg))
              if (r.status === "live" && r.lastScore?.decision === "kill-candidate")
                console.log(r.slug + "\t" + r.lastScore.reason);
          ' | while IFS=$'\t' read -r slug reason; do
            title="Kill candidate: $slug"
            if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "$reason

          Run \`factory kill $slug --confirm\` (workflow_dispatch: \`kill $slug --confirm\`) to remove it, or close this issue to keep it running."
            fi
          done
